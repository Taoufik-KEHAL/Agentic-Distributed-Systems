spring.application.name=agent-service

server.port=8084
spring.config.import=optional:configserver:http://localhost:9999

# LLM
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5-mini

# Serveurs MCP : url = adresse du service, le chemin /mcp est ajouté automatiquement
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.inventory.url=http://localhost:8085
spring.ai.mcp.client.streamable-http.connections.billing.url=http://localhost:8083